# Запасний варіант: основний деплой — Cloudflare Pages.
# Запускається лише вручну (Actions -> Deploy to GitHub Pages -> Run workflow).
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        # Репозиторій називається "march" -> сайт живе на /march/
        # Для власного домену або репо <user>.github.io прибери цей рядок.
        env:
          NUXT_APP_BASE_URL: /march/
        run: npm run generate

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
